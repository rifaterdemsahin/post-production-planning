<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nanabanana Production Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .scene-card { background-color: #1e1e1e; border: 1px solid #333; transition: all 0.3s ease; }
        .scene-card:hover { border-color: #555; }
        .btn-gen { background: linear-gradient(90deg, #4285F4, #34A853); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center bg-gray-900 p-4 rounded-lg shadow-lg">
        <div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-green-400">
                🍌 Gemini Nanabanana Creator
            </h1>
            <p class="text-sm text-gray-400">Post-Production Asset Generator</p>
        </div>
        <div class="flex gap-4 items-center">
            <input type="password" id="apiKey" placeholder="Paste Google API Key Here" 
                   class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-64 focus:outline-none focus:border-blue-500">
            <button onclick="downloadYAML()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm transition mr-2 shadow-sm font-semibold border border-blue-400">
                💾 Save YAML
            </button>
            <button onclick="downloadCSV()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition shadow-sm border border-gray-600">
                📥 Download CSV
            </button>
        </div>
    </div>

    <div id="app" class="max-w-7xl mx-auto grid grid-cols-1 gap-6">
        </div>

    <!-- Debug Console -->
    <div class="fixed bottom-0 left-0 w-full bg-gray-900 border-t border-gray-700 shadow-2xl transition-transform duration-300 transform translate-y-[calc(100%-40px)]" id="debug-panel">
        <div class="flex justify-between items-center bg-gray-800 p-2 cursor-pointer hover:bg-gray-700" onclick="toggleDebug()">
            <div class="flex items-center gap-4">
                <h3 class="text-sm font-bold text-gray-300 ml-4">🐞 Debug Console</h3>
                <a href="https://aistudio.google.com/logs" target="_blank" class="text-xs text-blue-400 hover:text-blue-300 hover:underline flex items-center gap-1" onclick="event.stopPropagation();">
                    Open AI Studio Logs ↗
                </a>
            </div>
            <span class="text-xs text-gray-500 mr-4">Click to Toggle</span>
        </div>
        <div id="debug-log" class="h-64 overflow-y-auto p-4 font-mono text-xs bg-black text-green-500 space-y-2">
            <div class="text-gray-500 italic">-- Debug logs will appear here --</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATA LOADING & INITIALIZATION
        // ==========================================
        let scenes = []; // Global variable to hold data after loading

        async function initApp() {
            try {
                // Fetch the YAML file
                const response = await fetch('scenes.yaml');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const yamlText = await response.text();
                
                // Parse YAML using js-yaml
                const data = jsyaml.load(yamlText);
                
                if (!data || !data.scenes) {
                    throw new Error("Invalid YAML format: 'scenes' key missing");
                }

                scenes = data.scenes;
                renderScenes();

            } catch (error) {
                console.error("Error loading scenes:", error);
                document.getElementById('app').innerHTML = `
                    <div class="bg-red-900 border border-red-500 text-red-200 p-4 rounded">
                        <h3 class="font-bold">⚠️ Error Loading Data</h3>
                        <p>${error.message}</p>
                        <p class="text-xs mt-2 text-gray-400">Make sure you are running this via a web server (http://localhost...) and not directly as a file.</p>
                    </div>
                `;
            }
        }

        // ==========================================
        // 2. RENDER UI
        // ==========================================
        function renderScenes() {
            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear loading state if any

            scenes.forEach((scene, sceneIndex) => {
                const sceneContainer = document.createElement('div');
                sceneContainer.className = `scene-card p-6 rounded-lg ${scene.color}`;
                
                let html = `
                    <div class="flex justify-between items-end mb-4 border-b border-gray-700 pb-2">
                        <h2 class="text-xl font-bold text-white">${scene.id}: ${scene.title}</h2>
                        <span class="text-xs text-gray-500">${scene.lines.length} Lines</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                `;

                scene.lines.forEach((line, lineIndex) => {
                    const uniqueId = `s${sceneIndex}_l${lineIndex}`;
                    // Default to image prompt
                    const currentPrompt = line.prompts ? line.prompts.image : "";

                    html += `
                        <div class="bg-gray-800 p-4 rounded relative">
                            <div class="flex justify-between text-xs text-gray-400 mb-2">
                                <span>⏱️ ${line.time}</span>
                                <span>Line ${line.id}</span>
                            </div>
                            <p class="text-sm italic text-gray-300 mb-3 line-clamp-2">"${line.script}"</p>
                            
                            <!-- Prompt Controls -->
                            <div class="mb-3">
                                <div class="flex flex-wrap gap-x-3 gap-y-2 mb-2">
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="image" checked 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">🖼️ Image</span>
                                            <span class="text-[9px] text-blue-400">gemini-3-pro-image-preview</span>
                                        </div>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="graphic" 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">📊 Graphic</span>
                                            <span class="text-[9px] text-blue-400">gemini-3-pro-image-preview</span>
                                        </div>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="music" 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">🎵 Music</span>
                                            <span class="text-[9px] text-gray-500">gemini-2.0-flash</span>
                                        </div>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="animation" 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">🎬 Animation</span>
                                            <span class="text-[9px] text-gray-500">gemini-2.0-flash</span>
                                        </div>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="overlay_text" 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">📝 Text</span>
                                            <span class="text-[9px] text-gray-500">gemini-2.0-flash</span>
                                        </div>
                                    </label>
                                    <label class="inline-flex items-center cursor-pointer hover:text-white transition">
                                        <input type="radio" name="type-${uniqueId}" value="sound_effect" 
                                            onchange="updatePromptDisplay('${uniqueId}', ${sceneIndex}, ${lineIndex})"
                                            class="form-radio text-blue-500 h-3 w-3">
                                        <div class="ml-1.5 flex flex-col">
                                            <span class="text-xs font-bold">🔊 SFX</span>
                                            <span class="text-[9px] text-gray-500">gemini-2.0-flash</span>
                                        </div>
                                    </label>
                                </div>
                                
                                <div class="relative">
                                    <textarea id="text-${uniqueId}" rows="3" 
                                            class="w-full bg-gray-900 text-green-400 font-mono text-xs p-2 rounded border border-gray-700 focus:outline-none focus:border-green-500 resize-none pr-8"
                                            oninput="handleTextChange('${uniqueId}', ${sceneIndex}, ${lineIndex})">${currentPrompt}</textarea>
                                    <button onclick="copyToClipboard('${uniqueId}')" 
                                            class="absolute top-2 right-2 text-gray-500 hover:text-white transition"
                                            title="Copy to Clipboard">
                                        <span id="copy-text-${uniqueId}" class="text-lg">📋</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center mt-2">
                                <button onclick="handleGenerate('${uniqueId}')" 
                                    class="btn-gen text-white px-4 py-1.5 rounded text-sm font-semibold hover:opacity-90 flex items-center gap-2">
                                    <span>Generate Artifact</span>
                                    <div id="loader-${uniqueId}" class="loader"></div>
                                </button>
                                <span id="status-${uniqueId}" class="text-xs text-gray-500"></span>
                            </div>
                            
                            <div id="result-container-${uniqueId}" class="mt-4 hidden p-3 bg-black rounded border border-gray-600 text-xs text-gray-300 font-mono overflow-auto max-h-[300px] whitespace-pre-wrap">
                                </div>
                        </div>
                    `;
                });

                html += `</div>`;
                sceneContainer.innerHTML = html;
                app.appendChild(sceneContainer);
            });
        }

            // ==========================================
        // 3. UI INTERACTIONS
        // ==========================================
        
        function handleTextChange(uniqueId, sceneIndex, lineIndex) {
            const textArea = document.getElementById(`text-${uniqueId}`);
            const selectedRadio = document.querySelector(`input[name="type-${uniqueId}"]:checked`);
            
            if (!selectedRadio) return;
            const type = selectedRadio.value;

            // Ensure prompt object exists
            if (!scenes[sceneIndex].lines[lineIndex].prompts) {
                scenes[sceneIndex].lines[lineIndex].prompts = {};
            }
            
            // Update Data Model
            scenes[sceneIndex].lines[lineIndex].prompts[type] = textArea.value;
        }

        function updatePromptDisplay(uniqueId, sceneIndex, lineIndex) {
            // Find the checked radio button
            const selectedRadio = document.querySelector(`input[name="type-${uniqueId}"]:checked`);
            if (!selectedRadio) return;
            
            const selectedType = selectedRadio.value;
            const textArea = document.getElementById(`text-${uniqueId}`);
            
            const promptContent = scenes[sceneIndex].lines[lineIndex].prompts[selectedType] || "";
            textArea.value = promptContent;
        }

        function copyToClipboard(uniqueId) {
            const textArea = document.getElementById(`text-${uniqueId}`);
            const copyTextSpan = document.getElementById(`copy-text-${uniqueId}`);
            
            textArea.select();
            textArea.setSelectionRange(0, 99999); // For mobile devices
            
            navigator.clipboard.writeText(textArea.value).then(() => {
                const originalText = copyTextSpan.innerText;
                copyTextSpan.innerText = "Copied!";
                setTimeout(() => {
                    copyTextSpan.innerText = "📋";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        function handleGenerate(uniqueId) {
            const promptText = document.getElementById(`text-${uniqueId}`).value;
            const selectedRadio = document.querySelector(`input[name="type-${uniqueId}"]:checked`);
            const type = selectedRadio ? selectedRadio.value : 'text';

            if (type === 'image' || type === 'graphic') {
                generateMultimodalContent(uniqueId, promptText);
            } else {
                generateContent(uniqueId, promptText);
            }
        }

        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            panel.classList.toggle('translate-y-[calc(100%-40px)]');
        }

        function logDebug(type, title, data) {
            const logContainer = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'ERROR' ? 'text-red-400' : (type === 'REQ' ? 'text-blue-400' : 'text-green-400');
            
            const entry = document.createElement('div');
            entry.className = "border-b border-gray-800 pb-2 mb-2";
            entry.innerHTML = `
                <div class="flex gap-2 font-bold mb-1">
                    <span class="text-gray-500">[${time}]</span>
                    <span class="${color}">${type}</span>
                    <span class="text-white">${title}</span>
                </div>
                <div class="text-gray-400 whitespace-pre-wrap pl-4">${JSON.stringify(data, null, 2)}</div>
            `;
            logContainer.prepend(entry);
        }

        // ==========================================
        // 4. API CALL LOGIC
        // ==========================================
        
        // 4a. Text-Only Generation
        async function generateContent(id, prompt) {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert("⚠️ Please paste your Google API Key at the top first.");
                return;
            }

            const loader = document.getElementById(`loader-${id}`);
            const status = document.getElementById(`status-${id}`);
            const container = document.getElementById(`result-container-${id}`);

            loader.style.display = "block";
            status.innerText = "Thinking...";
            status.className = "text-xs text-blue-400";
            container.classList.add('hidden');

            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            logDebug('REQ', 'Sending Text Request', { url, payload });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-goog-api-key': apiKey },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                logDebug('RES', `Response (${response.status})`, data);

                if (!response.ok) throw new Error(data.error?.message || `API Error: ${response.status}`);
                
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    const text = data.candidates[0].content.parts[0].text;
                    const logLink = '<div class="mt-4 pt-2 border-t border-gray-700"><a href="https://aistudio.google.com/logs/eLZaaeqLHrSlvdIP7eyI6AM" target="_blank" class="text-xs text-gray-500 hover:text-blue-400">View Logs ↗</a></div>';
                    container.innerHTML = `<div class="whitespace-pre-wrap">${text}</div>${logLink}`;
                    container.classList.remove('hidden');
                    status.innerText = "✅ Done";
                    status.className = "text-xs text-green-500";
                } else {
                    throw new Error("Unexpected response format");
                }
            } catch (error) {
                console.error(error);
                logDebug('ERROR', error.message, error);
                status.innerText = "❌ Failed";
                status.className = "text-xs text-red-500";
                container.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
                container.classList.remove('hidden');
            } finally {
                loader.style.display = "none";
            }
        }

        // 4b. Multimodal (Image) Generation
        async function generateMultimodalContent(id, prompt) {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert("⚠️ Please paste your Google API Key at the top first.");
                return;
            }

            const loader = document.getElementById(`loader-${id}`);
            const status = document.getElementById(`status-${id}`);
            const container = document.getElementById(`result-container-${id}`);

            loader.style.display = "block";
            status.innerText = "Creating...";
            status.className = "text-xs text-purple-400";
            container.classList.add('hidden');

            // Using gemini-3-pro-image-preview for high-quality image generation
            const modelId = "gemini-3-pro-image-preview";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: prompt }]
                    }
                ],
                generationConfig: {
                    responseModalities: ["IMAGE", "TEXT"],
                    imageConfig: { image_size: "1K" }
                }
            };

            logDebug('REQ', 'Sending Multimodal Request', { url, payload });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-goog-api-key': apiKey },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                logDebug('RES', `Response (${response.status})`, data);

                if (!response.ok) throw new Error(data.error?.message || `API Error: ${response.status}`);

                let htmlOutput = "";
                
                if (data.candidates?.[0]?.content?.parts) {
                    data.candidates[0].content.parts.forEach(part => {
                        if (part.inlineData) {
                            // Render Image
                            const imgSrc = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                            htmlOutput += `
                                <div class="mb-4">
                                    <img src="${imgSrc}" class="w-full h-auto rounded mb-2 border border-gray-700">
                                    <a href="${imgSrc}" download="generated_artifact_${id}.png" class="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 text-xs font-bold hover:underline">
                                        📥 Download Image
                                    </a>
                                </div>`;
                        } else if (part.text) {
                            // Render Text
                            htmlOutput += `<p class="mb-2 text-gray-300 border-l-2 border-purple-500 pl-2">${part.text}</p>`;
                        }
                    });
                }

                if (htmlOutput) {
                    const logLink = '<div class="mt-4 pt-2 border-t border-gray-700"><a href="https://aistudio.google.com/logs/eLZaaeqLHrSlvdIP7eyI6AM" target="_blank" class="text-xs text-gray-500 hover:text-blue-400">View Logs ↗</a></div>';
                    container.innerHTML = htmlOutput + logLink;
                    container.classList.remove('hidden');
                    status.innerText = "✅ Done";
                    status.className = "text-xs text-green-500";
                } else {
                    throw new Error("No content generated.");
                }

            } catch (error) {
                console.error(error);
                logDebug('ERROR', error.message, error);
                status.innerText = "❌ Failed";
                status.className = "text-xs text-red-500";
                container.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
                container.classList.remove('hidden');
            } finally {
                loader.style.display = "none";
            }
        }

        // ==========================================
        // 5. EXPORT & DOWNLOAD
        // ==========================================
        function downloadYAML() {
            if (scenes.length === 0) {
                alert("No data loaded to download.");
                return;
            }
            
            try {
                // Wrap in root object to match original structure
                const exportData = { scenes: scenes };
                // Dump to YAML
                const yamlStr = jsyaml.dump(exportData, { lineWidth: -1 });
                
                const blob = new Blob([yamlStr], { type: 'text/yaml' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                a.setAttribute('download', 'scenes.yaml');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                console.error("YAML Export failed:", e);
                alert("Failed to export YAML: " + e.message);
            }
        }

        function downloadCSV() {
            if (scenes.length === 0) {
                alert("No data loaded to download.");
                return;
            }
            // Add columns for all new prompt types
            let csv = "Scene,Line,Timecode,Detailed Script,Prompt Image,Prompt Graphic,Prompt Music,Prompt Animation,Prompt Overlay Text,Prompt Sound Effect\n";
            
            scenes.forEach(scene => {
                scene.lines.forEach(line => {
                    const p = line.prompts || {};
                    // Escape quotes for CSV for all fields
                    const safe = (text) => text ? `"${text.replace(/"/g, '""')}"` : '""';
                    
                    csv += `"${scene.id}", "${line.id}", "${line.time}", ${safe(line.script)}, ${safe(p.image)}, ${safe(p.graphic)}, ${safe(p.music)}, ${safe(p.animation)}, ${safe(p.overlay_text)}, ${safe(p.sound_effect)}\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'nanabanana_prompts.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
