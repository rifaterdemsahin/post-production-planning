scenes:
  - id: "SCENE 01"
    title: "The New Age"
    color: "border-l-4 border-blue-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Alright, let's dive right in..."
        prompt: "Cinematic medium shot of a confident tech presenter in a modern, dimly lit studio with dynamic blue and orange rim lighting, shallow depth of field, 8k resolution, high production value"
      - id: "2"
        time: "0:04"
        script: "...surviving and thriving in this new age..."
        prompt: "A chaotic but artistic collage of glowing holographic news headlines about Artificial Intelligence and Tech market shifts, cyberpunk aesthetic, motion blur, floating in dark void"
      - id: "3"
        time: "0:08"
        script: "...make your head spin."
        prompt: "First person POV shot of a modern office environment spinning rapidly with heavy radial motion blur, dizzying effect, photographic realism"
      - id: "4"
        time: "0:12"
        script: "The old rules broken."
        prompt: "Close up of an ancient leather-bound book labeled 'The Old Rules' disintegrating into golden dust particles against a pitch black background, dramatic lighting"
  - id: "SCENE 02"
    title: "The Avalanche"
    color: "border-l-4 border-green-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Skills gap..."
        prompt: "Surreal minimalist 3D render of a business person climbing a white ladder that abruptly ends in the middle of a cloudy sky, infinite drop below, conceptual art"
      - id: "2"
        time: "0:04"
        script: "Are you ready?"
        prompt: "Wide shot of a tiny human silhouette standing on a cliff edge facing a massive towering wall of digital purple and green storm clouds made of binary code, epic scale"
      - id: "3"
        time: "0:08"
        script: "AI Avalanche..."
        prompt: "Photorealistic majesty of a snow-capped mountain peak, perfectly calm blue sky, sharp details, national geographic style"
      - id: "4"
        time: "0:12"
        script: "Terrifying force..."
        prompt: "Action shot of a massive snow avalanche beginning to crumble down the mountain face, debris flying, terrifying power, white and gray palette"
  - id: "SCENE 03"
    title: "The Force"
    color: "border-l-4 border-orange-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Not gentle snow..."
        prompt: "Macro photography of a single intricate snowflake suspended in mid-air, crystallizing, sharp focus, blue mood lighting"
      - id: "2"
        time: "0:04"
        script: "Reshaping ground..."
        prompt: "The asphalt ground cracking open to reveal a glowing blue wireframe grid underneath, 3D render, mixture of reality and digital simulation"
      - id: "3"
        time: "0:08"
        script: "Traditional resume..."
        prompt: "A single sheet of paper resume floating helplessly in a dark stormy void, spotlight on the paper, crumpled edges, dramatic"
      - id: "4"
        time: "0:12"
        script: "Buried..."
        prompt: "POV of being buried under snow, white out, light fading from the top, claustrophobic atmosphere"
  - id: "SCENE 04"
    title: "Seismic Shift"
    color: "border-l-4 border-red-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Seismic shift..."
        prompt: "Close up of a seismograph needle scribbling violently in red ink on paper, panic atmosphere, gritty texture"
      - id: "2"
        time: "0:04"
        script: "Bare minimum..."
        prompt: "A timelapse composite showing a shiny gold medal rapidly oxidizing and turning into rusted iron, centered composition, black background"
      - id: "3"
        time: "0:08"
        script: "Complex problems..."
        prompt: "A futuristic mechanical puzzle cube glowing with complex mathematical formulas, floating in zero gravity, intricate details"
      - id: "4"
        time: "0:12"
        script: "New thinking..."
        prompt: "Medical illustration style of a human brain made entirely of glowing fiber optic cables and digital nodes, cyan and magenta lighting"
