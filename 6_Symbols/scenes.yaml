scenes:
  - id: "SCENE 01"
    title: "The New Age"
    color: "border-l-4 border-blue-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Alright, let's dive right in..."
        prompts:
          image: "Cinematic medium shot of a confident tech presenter in a modern, dimly lit studio with dynamic blue and orange rim lighting, shallow depth of field, 8k resolution, high production value"
          graphic: "Sleek, modern lower third appearing with 'John Doe - Future Tech Analyst' in neon blue"
          music: "Low, pulsing synth pad establishing a serious but curious tone, 120 BPM"
          animation: "Subtle slow zoom in on the presenter's face to build intimacy"
          overlay_text: "THE NEW AGE"
          sound_effect: "Subtle high-tech whoosh sound on transition"
      - id: "2"
        time: "0:04"
        script: "...surviving and thriving in this new age..."
        prompts:
          image: "A chaotic but artistic collage of glowing holographic news headlines about Artificial Intelligence and Tech market shifts, cyberpunk aesthetic, motion blur, floating in dark void"
          graphic: "Digital stock ticker scrolling rapidly at the bottom with 'AI UP', 'JOBS DOWN', 'MARKET SHIFT'"
          music: "Tempo increases slightly, adding a rhythmic digital percussion layer"
          animation: "Floating icons and headlines drifting towards the camera, parallex effect"
          overlay_text: "AI REVOLUTION"
          sound_effect: "Digital data processing chirps and beeps"
      - id: "3"
        time: "0:08"
        script: "...make your head spin."
        prompts:
          image: "First person POV shot of a modern office environment spinning rapidly with heavy radial motion blur, dizzying effect, photographic realism"
          graphic: "Motion blur lines intensifying the feeling of speed"
          music: "A disorienting, resonant swell that pitches up slightly"
          animation: "Camera spins 360 degrees rapidly"
          overlay_text: ""
          sound_effect: "Deep, airy whoosh sound syncs with the spin"
      - id: "4"
        time: "0:12"
        script: "The old rules broken."
        prompts:
          image: "Close up of an ancient leather-bound book labeled 'The Old Rules' disintegrating into golden dust particles against a pitch black background, dramatic lighting"
          graphic: "Golden particles drifting across the screen"
          music: "Dramatic bass drop, cutting out the percussion for impact"
          animation: "Slow motion disintegration of the book cover"
          overlay_text: "RULES BROKEN"
          sound_effect: "Sound of heavy stone cracking or dry paper crumbling"
  - id: "SCENE 02"
    title: "The Avalanche"
    color: "border-l-4 border-green-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Skills gap..."
        prompts:
          image: "Surreal minimalist 3D render of a business person climbing a white ladder that abruptly ends in the middle of a cloudy sky, infinite drop below, conceptual art"
          graphic: "A line graph projected in the sky plummeting downwards in red"
          music: "Tense, staccato strings entering to create urgency"
          animation: "Ladder extending infinitely upwards but leading nowhere"
          overlay_text: "SKILLS GAP"
          sound_effect: "Hollow wind howling sound"
      - id: "2"
        time: "0:04"
        script: "Are you ready?"
        prompts:
          image: "Wide shot of a tiny human silhouette standing on a cliff edge facing a massive towering wall of digital purple and green storm clouds made of binary code, epic scale"
          graphic: "Matrix-style binary code raining down from the clouds"
          music: "Deep cinematic drum beat kicks in, 'Boom... Boom...'"
          animation: "Storm clouds swirling aggressively"
          overlay_text: "ARE YOU READY?"
          sound_effect: "Distant thunder rumble mixed with digital static"
      - id: "3"
        time: "0:08"
        script: "AI Avalanche..."
        prompts:
          image: "Photorealistic majesty of a snow-capped mountain peak, perfectly calm blue sky, sharp details, national geographic style"
          graphic: "Altitude meter rising rapidly on the side"
          music: "Orchestral rise, building tension"
          animation: "Slow panoramic pan up the mountain face"
          overlay_text: "THE FORCE"
          sound_effect: "Sudden silence followed by a low frequency wind build-up"
      - id: "4"
        time: "0:12"
        script: "Terrifying force..."
        prompts:
          image: "Action shot of a massive snow avalanche beginning to crumble down the mountain face, debris flying, terrifying power, white and gray palette"
          graphic: "Warning icons flashing red in corners"
          music: "Heavy percussive impact, loud and chaotic"
          animation: "Camera shake effect to simulate impact"
          overlay_text: "WARNING"
          sound_effect: "Roar of the avalanche, like a freight train"
  - id: "SCENE 03"
    title: "The Force"
    color: "border-l-4 border-orange-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Not gentle snow..."
        prompts:
          image: "Macro photography of a single intricate snowflake suspended in mid-air, crystallizing, sharp focus, blue mood lighting"
          graphic: "Geometric fractals overlaying the snowflake"
          music: "Delicate, high-pitched piano melody, contrasting the previous chaos"
          animation: "Slow rotation of the snowflake"
          overlay_text: "PRECISION"
          sound_effect: "High-pitched crystal chime or glass sound"
      - id: "2"
        time: "0:04"
        script: "Reshaping ground..."
        prompts:
          image: "The asphalt ground cracking open to reveal a glowing blue wireframe grid underneath, 3D render, mixture of reality and digital simulation"
          graphic: "Wireframe grid lines spreading out"
          music: "Electronic glitch sound effects integrated into the rhythm"
          animation: "The crack expanding to reveal the digital world below"
          overlay_text: "FOUNDATIONS"
          sound_effect: "Digital transformation sci-fi sound"
      - id: "3"
        time: "0:08"
        script: "Traditional resume..."
        prompts:
          image: "A single sheet of paper resume floating helplessly in a dark stormy void, spotlight on the paper, crumpled edges, dramatic"
          graphic: "A spotlight beam tracking the paper"
          music: "Melancholic cello solo, slow and sad"
          animation: "Paper drifting aimlessly in the wind"
          overlay_text: "TRADITION"
          sound_effect: "Lonely paper rustling sound"
      - id: "4"
        time: "0:12"
        script: "Buried..."
        prompts:
          image: "POV of being buried under snow, white out, light fading from the top, claustrophobic atmosphere"
          graphic: "Vignette darkening the edges heavily"
          music: "Muffled drone, underwater feeling"
          animation: "Fade to white then cut to black"
          overlay_text: "OBSOLETE"
          sound_effect: "Slow, heavy heartbeat"
  - id: "SCENE 04"
    title: "Seismic Shift"
    color: "border-l-4 border-red-500"
    lines:
      - id: "1"
        time: "0:00"
        script: "Seismic shift..."
        prompts:
          image: "Close up of a seismograph needle scribbling violently in red ink on paper, panic atmosphere, gritty texture"
          graphic: "Waveform line oscillating wildly across the screen"
          music: "Rhythmic scratching sound acting as percussion"
          animation: "Needle moving frantically back and forth"
          overlay_text: "MAGNITUDE 10"
          sound_effect: "Sound of a pen scratching violently on paper"
      - id: "2"
        time: "0:04"
        script: "Bare minimum..."
        prompts:
          image: "A timelapse composite showing a shiny gold medal rapidly oxidizing and turning into rusted iron, centered composition, black background"
          graphic: "Digital countdown timer reaching zero"
          music: "Ticking clock sound, accelerating"
          animation: "Time-lapse speed ramp"
          overlay_text: "DECAY"
          sound_effect: "Loud ticking clock"
      - id: "3"
        time: "0:08"
        script: "Complex problems..."
        prompts:
          image: "A futuristic mechanical puzzle cube glowing with complex mathematical formulas, floating in zero gravity, intricate details"
          graphic: "Math formulas floating around the object"
          music: "Complex synthesizer arpeggio, intellectual vibe"
          animation: "The cube twisting and solving itself"
          overlay_text: "COMPLEXITY"
          sound_effect: "Mechanical clicks and whirs"
      - id: "4"
        time: "0:12"
        script: "New thinking..."
        prompts:
          image: "Medical illustration style of a human brain made entirely of glowing fiber optic cables and digital nodes, cyan and magenta lighting"
          graphic: "Network nodes connecting rapidly"
          music: "Uplifting, major key synth chord swell"
          animation: "Light pulses travelling through the fiber optics"
          overlay_text: "NEURAL NETWORK"
          sound_effect: "Futuristic power-up hum"
