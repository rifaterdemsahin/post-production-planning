<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Dynamic HTML Recorder</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f0f0f0; margin: 0; }
.container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; }
button { padding: 10px 20px; margin: 5px; font-size: 14px; cursor: pointer; border: none; border-radius: 3px; color: white; }
#start { background: #e74c3c; }
#stop { background: #27ae60; }
#download { background: #3498db; }
#loadHtml { background: #9b59b6; }
button:disabled { background: #95a5a6; cursor: not-allowed; }
#status { padding: 10px; background: #ecf0f1; margin: 10px 0; border-radius: 3px; }
video { max-width: 100%; margin: 10px 0; border: 1px solid #ddd; }
.preview-container { border: 2px solid #3498db; margin: 10px 0; background: white; position: relative; }
#preview { width: 100%; min-height: 400px; }
textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 3px; }
.tabs { display: flex; gap: 5px; margin: 10px 0; }
.tab { padding: 10px 20px; background: #ecf0f1; border: none; cursor: pointer; border-radius: 3px 3px 0 0; }
.tab.active { background: #3498db; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
label { display: block; margin: 10px 0 5px; font-weight: bold; }
.size-inputs { display: flex; gap: 10px; align-items: center; }
.size-inputs input { width: 100px; padding: 5px; }
.debug-console { margin-top: 20px; border-top: 2px solid #ddd; padding-top: 10px; }
#debugLog { width: 100%; height: 150px; background: #333; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 3px; overflow-y: scroll; margin-bottom: 5px; box-sizing: border-box; }
.debug-controls { display: flex; gap: 10px; }
.debug-controls button { font-size: 12px; padding: 5px 10px; }
/* Modal Styles */
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
.modal-header h3 { margin: 0; }
.modal-close { cursor: pointer; font-size: 20px; color: #999; }
.modal-close:hover { color: #333; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 12px; }
.form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn-save { background: #3498db; }
.btn-cancel { background: #95a5a6; }
</style>
</head>
<body>
<div class="container">
<h2>Dynamic HTML Animation Recorder</h2>
<p>Paste your HTML content below, preview it, then record it as WebM video!</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('input')">Input HTML</button>
<button class="tab" onclick="switchTab('preview')">Preview</button>
</div>

<div id="inputTab" class="tab-content active">
    <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 5px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button id="loadSampleBtn" style="background: #8e44ad; margin: 0;">✨ Load Sample Animation</button>
            <span style="color: #6c757d; font-size: 0.9em;">Click to see a complex example & prompt</span>
        </div>
        
        <div id="samplePromptContainer" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #dee2e6;">
            <label style="color: #495057; margin-bottom: 8px;">Prompt used to generate this animation:</label>
            <textarea id="promptOutput" readonly style="height: 150px; background: #fff; color: #333; font-family: monospace; font-size: 11px; margin-bottom: 0;"></textarea>
        </div>
    </div>

    <label>Paste your HTML content here:</label>
<textarea id="htmlInput" placeholder="<div style='background: linear-gradient(45deg, #667eea, #764ba2); width: 800px; height: 450px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; font-family: Arial;'>
  <div class='box' style='animation: spin 2s linear infinite;'>Hello World!</div>
</div>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>"></textarea>

<label>Canvas Size:</label>
<div class="size-inputs">
<span>Width: <input type="number" id="width" value="800" min="100"> px</span>
<span>Height: <input type="number" id="height" value="450" min="100"> px</span>
</div>

<label>Recording Duration:</label>
<select id="duration">
<option value="3">3 seconds</option>
<option value="5">5 seconds</option>
<option value="10" selected>10 seconds</option>
<option value="15">15 seconds</option>
<option value="20">20 seconds</option>
<option value="30">30 seconds</option>
<option value="0">Manual stop</option>
</select>

<div style="margin-top: 15px;">
<button id="loadHtml">Load HTML to Preview</button>
</div>
</div>

<div id="previewTab" class="tab-content">
<div class="preview-container">
<div id="preview"></div>
</div>

<div>
<button id="start">Start Recording</button>
<button id="stop" disabled>Stop Recording</button>
<button id="download" disabled>Download WebM</button>
<button id="uploadToDriveBtn" disabled style="background: #2ecc71;">☁️ Upload to Drive</button>
<button onclick="openDriveModal()" style="background: #7f8c8d; padding: 8px 12px;">⚙️ Drive Config</button>
</div>

<div id="status">Load HTML first, then start recording</div>

<canvas id="canvas" style="display: none;"></canvas>
<video id="video" controls style="display:none"></video>
</div>

</div>

<div class="debug-console">
    <h3>Debug Console</h3>
    <textarea id="debugLog" readonly></textarea>
    <div class="debug-controls">
        <button onclick="copyDebugLogs()" style="background: #34495e;">📋 Copy Logs</button>
        <button onclick="clearDebugLogs()" style="background: #95a5a6;">🗑️ Clear Logs</button>
    </div>
</div>

<!-- Drive Config Modal -->
<div id="driveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>☁️ Google Drive Config</h3>
            <span class="modal-close" onclick="closeDriveModal()">&times;</span>
        </div>
        <div class="form-group">
            <label>Google Client ID:</label>
            <input type="text" id="driveClientId" placeholder="e.g. 12345...apps.googleusercontent.com">
        </div>
        <div class="form-group">
            <label>Target Folder ID:</label>
            <input type="text" id="driveFolderId" value="1E_ctpNSyieC_fr2xowbg_RfXZDVWbgzJ" placeholder="Folder ID from URL">
        </div>
        <div class="form-group">
            <label>Browse Subfolders:</label>
            <div style="display: flex; gap: 5px; align-items: center;">
                <select id="subfolderSelect" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="">-- Click 'Load' to browse subfolders --</option>
                </select>
                <button onclick="loadSubfolders()" style="background: #9b59b6; padding: 8px 12px; font-size: 12px;">📂 Load</button>
            </div>
            <div id="folderPath" style="font-size: 11px; color: #666; margin-top: 5px;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeDriveModal()">Cancel</button>
            <button class="btn-save" onclick="saveDriveConfig()">Save Config</button>
        </div>
    </div>
</div>

<script>
// Debugging Logic
const debugLog = document.getElementById('debugLog');

function logToConsole(msg, type = 'INFO') {
    const timestamp = new Date().toLocaleTimeString();
    const logLine = `[${timestamp}] [${type}] ${msg}\n`;
    if (debugLog) {
        debugLog.value += logLine;
        debugLog.scrollTop = debugLog.scrollHeight; // Auto-scroll
    }
    // Also log to real console to avoid breaking it
    if (type === 'ERROR') {
         // Prevent infinite loop if we override console.error later (not doing full override here for safety)
         // But for now, we just append to our textarea
    }
}

// Global error handler
window.onerror = function(message, source, lineno, colno, error) {
    logToConsole(`${message} at ${source}:${lineno}:${colno}`, 'ERROR');
    console.error(error); // Keep original behavior
};

// Override console.log and console.error safely
const originalLog = console.log;
const originalError = console.error;

console.log = function(...args) {
    logToConsole(args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' '));
    originalLog.apply(console, args);
};

console.error = function(...args) {
    logToConsole(args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' '), 'ERROR');
    originalError.apply(console, args);
};

function copyDebugLogs() {
    if (!debugLog) return;
    debugLog.select();
    debugLog.setSelectionRange(0, 99999); // For mobile
    navigator.clipboard.writeText(debugLog.value).then(() => {
        alert('Logs copied to clipboard!');
    }).catch(err => {
        console.error('Failed to copy logs:', err);
        alert('Failed to copy logs');
    });
}

function clearDebugLogs() {
    if (debugLog) debugLog.value = '';
}

const htmlInput = document.getElementById('htmlInput');
const preview = document.getElementById('preview');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const dlBtn = document.getElementById('download');
const loadBtn = document.getElementById('loadHtml');
const durSel = document.getElementById('duration');
const widthInput = document.getElementById('width');
const heightInput = document.getElementById('height');
const status = document.getElementById('status');
const video = document.getElementById('video');
const uploadBtn = document.getElementById('uploadToDriveBtn');

let recorder;
let chunks = [];
let recordedBlob = null;
let animFrame;
let timeout;
let isRecording = false;

// Drive Logic
let tokenClient;
let accessToken = null;

function getDriveConfig() {
    const config = localStorage.getItem('drive_config');
    return config ? JSON.parse(config) : null;
}

function openDriveModal() {
    const config = getDriveConfig();
    if (config) {
        document.getElementById('driveClientId').value = config.clientId || '';
        document.getElementById('driveFolderId').value = config.folderId || '1E_ctpNSyieC_fr2xowbg_RfXZDVWbgzJ';
    }
    document.getElementById('driveModal').style.display = 'block';
}

function closeDriveModal() {
    document.getElementById('driveModal').style.display = 'none';
}

function saveDriveConfig() {
    const clientId = document.getElementById('driveClientId').value.trim();
    const folderId = document.getElementById('driveFolderId').value.trim();

    if (!clientId || !folderId) {
        alert("Please enter both Client ID and Folder ID.");
        return;
    }

    localStorage.setItem('drive_config', JSON.stringify({ clientId, folderId }));
    closeDriveModal();
    
    accessToken = null; 
    initTokenClient(clientId);
    alert("Configuration Saved!");
}

async function loadSubfolders() {
    const parentFolderId = document.getElementById('driveFolderId').value.trim();
    const subfolderSelect = document.getElementById('subfolderSelect');
    const folderPath = document.getElementById('folderPath');
    
    if (!parentFolderId) {
        alert('Please enter a parent Folder ID first.');
        return;
    }
    
    try {
        const token = await getAccessToken();
        subfolderSelect.innerHTML = '<option value="">⏳ Loading...</option>';
        
        // Fetch subfolders
        const query = `'${parentFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
        const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&orderBy=name`;
        
        const res = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Failed to load folders');
        
        subfolderSelect.innerHTML = '<option value="">-- Select a subfolder --</option>';
        subfolderSelect.innerHTML += `<option value="${parentFolderId}">📁 (Current folder)</option>`;
        
        if (data.files && data.files.length > 0) {
            data.files.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = '📂 ' + folder.name;
                subfolderSelect.appendChild(option);
            });
            folderPath.textContent = `Found ${data.files.length} subfolder(s)`;
        } else {
            folderPath.textContent = 'No subfolders found in this folder';
        }
        
    } catch (err) {
        console.error('Error loading subfolders:', err);
        subfolderSelect.innerHTML = '<option value="">-- Error loading folders --</option>';
        folderPath.textContent = 'Error: ' + err.message;
    }
}

function selectSubfolder() {
    const subfolderSelect = document.getElementById('subfolderSelect');
    const folderId = document.getElementById('driveFolderId');
    
    if (subfolderSelect.value) {
        folderId.value = subfolderSelect.value;
    }
}

// Add event listener for subfolder selection
document.addEventListener('DOMContentLoaded', () => {
    const subfolderSelect = document.getElementById('subfolderSelect');
    if (subfolderSelect) {
        subfolderSelect.addEventListener('change', selectSubfolder);
    }
});

function initTokenClient(clientId) {
    if (!window.google) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (tokenResponse) => {
            accessToken = tokenResponse.access_token;
            if (window.pendingUploadResolver) {
                 window.pendingUploadResolver(accessToken);
                 window.pendingUploadResolver = null;
            }
        },
    });
}

async function getAccessToken() {
    const config = getDriveConfig();
    if (!config || !config.clientId) {
        openDriveModal();
        throw new Error("Missing Drive Config");
    }
    if (accessToken) return accessToken;
    return new Promise((resolve) => {
        window.pendingUploadResolver = resolve;
        if (!tokenClient) initTokenClient(config.clientId);
        tokenClient.requestAccessToken({ prompt: '' }); 
    });
}

async function uploadToDrive() {
    if (!recordedBlob) {
        alert("No recording found!");
        return;
    }

    const originalText = uploadBtn.innerText;
    uploadBtn.innerText = "⏳ Uploading...";
    uploadBtn.disabled = true;

    try {
        const token = await getAccessToken();
        const config = getDriveConfig();
        const filename = `recording-${Date.now()}.webm`;

        const metadata = {
            name: filename,
            parents: [config.folderId]
        };

        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', recordedBlob);

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: form
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "Upload failed");

        console.log("Uploaded to Drive:", data.webViewLink);
        status.textContent = "✅ Uploaded to Drive!";
        alert(`Success! View here:\n${data.webViewLink}`);
        
    } catch (err) {
        console.error(err);
        if (err.message !== "Missing Drive Config") {
            alert("Upload failed: " + err.message);
        }
    } finally {
        uploadBtn.innerText = originalText;
        uploadBtn.disabled = false;
    }
}

// Drive Init on Load
window.addEventListener('load', () => {
    const config = getDriveConfig();
    if (config && config.clientId) {
        const checkG = setInterval(() => {
            if (window.google) {
                clearInterval(checkG);
                initTokenClient(config.clientId);
            }
        }, 100);
    }
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  
  if (tab === 'input') {
    document.querySelector('.tab:nth-child(1)').classList.add('active');
    document.getElementById('inputTab').classList.add('active');
  } else {
    document.querySelector('.tab:nth-child(2)').classList.add('active');
    document.getElementById('previewTab').classList.add('active');
  }
}

function loadHtml() {
  const html = htmlInput.value.trim();
  if (!html) {
    alert('Please enter some HTML content first!');
    return;
  }
  
  const width = parseInt(widthInput.value) || 800;
  const height = parseInt(heightInput.value) || 450;
  
  // Set canvas size
  canvas.width = width;
  canvas.height = height;
  
  // Load HTML into preview
  preview.innerHTML = html;
  preview.style.width = width + 'px';
  preview.style.height = height + 'px';
  
  status.textContent = 'HTML loaded! Click "Start Recording" to begin.';
  startBtn.disabled = false;
  
  // Switch to preview tab
  switchTab('preview');
  
  // Start capture loop
  startCaptureLoop();
}

function startCaptureLoop() {
  function capture() {
    if (!isRecording) return;
    
    // Use html2canvas to safely render DOM to canvas without tainting
    if (typeof html2canvas === 'undefined') {
        alert("Error: html2canvas library not loaded. Check internet connection.");
        isRecording = false;
        return;
    }

    html2canvas(preview, {
      backgroundColor: null,
      scale: 1,
      logging: false,
      useCORS: true,
      width: canvas.width,
      height: canvas.height,
      removeContainer: true
    }).then(renderedCanvas => {
      if (!isRecording) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(renderedCanvas, 0, 0);
      
      // Schedule next frame
      requestAnimationFrame(capture);
    }).catch(err => {
      console.error("Capture error:", err);
      isRecording = false;
    });
  }
  
  isRecording = true;
  capture();
}

function startRec() {
  chunks = [];
  
  const stream = canvas.captureStream(30);
  const opts = { mimeType: 'video/webm' };
  
  if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
    opts.mimeType = 'video/webm;codecs=vp9';
  } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
    opts.mimeType = 'video/webm;codecs=vp8';
  }
  
  recorder = new MediaRecorder(stream, opts);
  
  recorder.ondataavailable = e => {
    if (e.data.size > 0) chunks.push(e.data);
  };
  
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    video.src = url;
    video.style.display = 'block';
    dlBtn.disabled = false;
    dlBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'recording-' + Date.now() + '.webm';
      a.click();
    };
    status.textContent = 'Recording complete! Download your video below.';
    isRecording = false;
    recordedBlob = blob;
    dlBtn.disabled = false;
    uploadBtn.disabled = false;
  };
  
  recorder.start();
  startBtn.disabled = true;
  stopBtn.disabled = false;
  durSel.disabled = true;
  status.textContent = 'Recording...';
  
  const dur = parseInt(durSel.value);
  if (dur > 0) {
    timeout = setTimeout(stopRec, dur * 1000);
  }
}

function stopRec() {
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }
  if (timeout) clearTimeout(timeout);
  if (animFrame) cancelAnimationFrame(animFrame);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  durSel.disabled = false;
}

loadBtn.onclick = loadHtml;
startBtn.onclick = startRec;
stopBtn.onclick = stopRec;
uploadBtn.onclick = uploadToDrive;

const loadSampleBtn = document.getElementById('loadSampleBtn');
const promptOutput = document.getElementById('promptOutput');
const samplePromptContainer = document.getElementById('samplePromptContainer');

const sampleHtml = `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
  
  <!-- Animated background particles -->
  <div class="particle" style="position: absolute; width: 20px; height: 20px; background: rgba(255,255,255,0.3); border-radius: 50%; top: 20%; left: 10%; animation: float 4s ease-in-out infinite;"></div>
  <div class="particle" style="position: absolute; width: 15px; height: 15px; background: rgba(255,255,255,0.2); border-radius: 50%; top: 60%; left: 80%; animation: float 6s ease-in-out infinite 1s;"></div>
  <div class="particle" style="position: absolute; width: 25px; height: 25px; background: rgba(255,255,255,0.25); border-radius: 50%; top: 40%; left: 50%; animation: float 5s ease-in-out infinite 2s;"></div>
  
  <!-- Main content -->
  <div style="text-align: center; z-index: 10;">
    <h1 style="color: white; font-size: 72px; margin: 0; animation: slideDown 1s ease-out, pulse 2s ease-in-out infinite 1s; font-family: Arial, sans-serif; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">
      Welcome
    </h1>
    <div style="width: 200px; height: 200px; margin: 30px auto; position: relative;">
      <div class="spinner" style="position: absolute; width: 100%; height: 100%; border: 8px solid rgba(255,255,255,0.2); border-top: 8px solid white; border-radius: 50%; animation: spin 2s linear infinite;"></div>
      <div style="position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 48px; animation: colorChange 3s linear infinite;">
        🚀
      </div>
    </div>
    <p style="color: rgba(255,255,255,0.9); font-size: 24px; animation: fadeIn 2s ease-out; font-family: Arial, sans-serif;">
      Creating Amazing Animations
    </p>
  </div>
  
</div>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes slideDown {
  from { 
    transform: translateY(-50px); 
    opacity: 0; 
  }
  to { 
    transform: translateY(0); 
    opacity: 1; 
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
}

@keyframes colorChange {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
</style>`;

const samplePrompt = `Create a complete HTML snippet with inline styles and CSS animations for a [DESCRIPTION]. 
The HTML should be self-contained with all styles in <style> tags at the bottom.

Requirements:
- Width and height should use 100% to fill the canvas area
- Include smooth CSS animations (transform, opacity, etc.)
- Use vibrant gradients for backgrounds
- Add multiple animated elements (minimum 3)
- Include keyframe animations that loop infinitely
- Use modern CSS (flexbox, gradients, transforms, shadows)
- Make it visually impressive and suitable for a 10-second video recording

Theme: [YOUR THEME HERE - e.g., "space exploration", "product launch", "celebration", "tech startup", "nature/ocean", "geometric shapes"]

Return only the HTML code, ready to paste into the recorder.`;

loadSampleBtn.onclick = () => {
  htmlInput.value = sampleHtml;
  promptOutput.value = samplePrompt;
  samplePromptContainer.style.display = 'block';
  loadHtml();
};

// Load default example
loadHtml();
</script>
</body>
</html>
