# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Validate YAML files before deployment
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install yamllint
        run: pip install yamllint
      
      - name: Validate YAML files
        run: |
          echo "🔍 Validating YAML files..."
          
          # Validate scenes.yaml with relaxed rules (allows long lines)
          echo "Checking 6_Symbols/scenes.yaml..."
          python3 -c "import yaml; yaml.safe_load(open('6_Symbols/scenes.yaml'))" && echo "✅ scenes.yaml is valid" || exit 1
          
          # Validate template.yaml
          echo "Checking 6_Symbols/template.yaml..."
          python3 -c "import yaml; yaml.safe_load(open('6_Symbols/template.yaml'))" && echo "✅ template.yaml is valid" || exit 1
          
          # Validate constraints.yaml
          echo "Checking 6_Symbols/constraints.yaml..."
          python3 -c "import yaml; yaml.safe_load(open('6_Symbols/constraints.yaml'))" && echo "✅ constraints.yaml is valid" || exit 1
          
          echo "✅ All YAML files validated successfully!"

  # Single deploy job since we're just deploying
  deploy:
    needs: validate-yaml
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "."
      - name: Deploy to GitHub Pages
        if: vars.DONOTDEPLOY != 'FALSE'
        id: deployment
        uses: actions/deploy-pages@v4
